[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt","env-filter"] }
