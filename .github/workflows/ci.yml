name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (Next.js) build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  engine:
    name: Engine (Rust) build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine/daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cargo build
        run: cargo build --release
